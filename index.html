<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵感工作台 · 高频共情故事选题系统</title>
<meta name="description" content="26个灵感方向（共情故事+热门类型）、490+个情境、690+组人物关系、490+个故事场景、10+个转折词，把『想选题』变成『抽公式』。">
<link rel="stylesheet" href="assets/style.css?v=19">
<style>
.stat-strip{display:flex;gap:0;align-items:baseline;flex-wrap:wrap;margin-top:54px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0}
.stat-strip .st{margin-right:clamp(22px,4.5vw,54px)}
.stat-strip .n{font-size:clamp(26px,3.4vw,38px);font-weight:900}
.stat-strip .l{font-size:12px;color:var(--dimmer);margin-left:8px;letter-spacing:.08em}
.entries{display:flex;gap:clamp(20px,4vw,48px);flex-wrap:wrap;margin-top:44px}
.entry{display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:800;cursor:pointer;
  color:var(--dim);transition:color .25s}
.entry:hover{color:var(--txt)}
.entry .e-arr{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;
  font-size:13px;color:var(--vio);transition:all .35s var(--spring)}
.entry:hover .e-arr{background:var(--grad);color:#160b2e;transform:translateX(4px);border-color:transparent}
</style>
</head>
<body>
<div class="wrap">

  <section style="min-height:86vh;display:flex;flex-direction:column;justify-content:center">
    <div class="kicker rise">EMPATHY STORY LAB</div>
    <h1 class="display">
      <span class="grad-t" data-chars>别憋选题了，</span><br>
      <span data-chars>抽一条公式。</span>
    </h1>
    <p class="lead rise" style="margin-top:24px;font-size:16px">
      26 个灵感方向（共情故事 + 行业热门类型）、近 500 个情境，配上人物关系、故事场景和转折词——灵感不靠憋，靠抽。
    </p>
    <div class="rise" style="display:flex;gap:14px;margin-top:36px;flex-wrap:wrap">
      <a class="btn btn-pri rip" href="studio.html">🎲 抽一条 <span class="arr">→</span></a>
      <a class="btn btn-ghost rip" href="matrix.html">灵感方向</a>
    </div>

    <!-- 今日配方：三种模式各一条，按日固定 -->
    <div class="rise" style="margin-top:48px">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px">
        <b style="font-size:12px;letter-spacing:.26em;color:var(--vio)">今日配方</b>
        <button class="btn btn-ghost btn-sm rip" id="reRoll">🎲 全部换一批</button>
      </div>
      <div id="heroCards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;max-width:1060px"></div>
    </div>

    <!-- 统计条 -->
    <div class="stat-strip rise" id="statStrip">
      <span class="st"><span class="n grad-t" id="stDom">–</span><span class="l">个灵感方向</span></span>
      <span class="st"><span class="n grad-t" id="stTag">–</span><span class="l">情境</span></span>
      <span class="st"><span class="n grad-t" id="stL1">–</span><span class="l">类</span></span>
      <span class="st"><span class="n grad-t" id="stMod">–</span><span class="l">转折词</span></span>
    </div>

    <!-- 入口 -->
    <div class="entries rise">
      <a class="entry rip" href="matrix.html"><span class="e-arr">→</span>灵感方向</a>
      <a class="entry rip" href="studio.html"><span class="e-arr">→</span>灵感组合</a>
      <a class="entry rip" href="workbench.html"><span class="e-arr">→</span>创作工作台</a>
      <a class="entry rip" href="method.html"><span class="e-arr">→</span>怎么用</a>
    </div>
  </section>

</div>

<script src="assets/data.js?v=19"></script>
<script src="assets/common.js?v=19"></script>
<script src="assets/cloud.js?v=19"></script>
<script>
initPage('index.html',false);

const heroCache={};
function heroCard(mode,seeded){
  const pf=seeded?dailyPF(mode):randomPF(mode);
  heroCache[mode]=pf;
  const chips=pf.map(x=>`<span class="chip ${x.cat==='mod'?'mod':''}" style="cursor:default;pointer-events:none">
    <span class="src">${CAT_NAME[x.cat]}</span>${esc(x.cat==='sit'?x.dom+'·'+x.tag:x.tag)}</span>`).join('');
  const text=mode==='story'?pfSentence(pf):pfOutText(pf,mode);
  return `<div class="card" style="cursor:default;padding:18px 20px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <b style="font-size:13px;font-weight:800">${MODE_NAME[mode]}配方</b>
      <span style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm rip" data-hero-copy="${mode}">复制</button>
        <button class="btn btn-pri btn-sm rip" data-hero-wb="${mode}">去创作 ▶</button>
      </span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px">${chips}</div>
    <p style="color:var(--dim);font-size:13.5px;line-height:1.8;margin:0">${esc(text)}</p>
  </div>`;
}
function renderHero(){
  $('#heroCards').innerHTML=MODES.map(m=>heroCard(m,true)).join('');
}
$('#reRoll').addEventListener('click',()=>{
  const b=$('#heroCards');b.style.opacity=0;b.style.transform='translateY(8px)';
  setTimeout(()=>{b.innerHTML=MODES.map(m=>heroCard(m,false)).join('');b.style.transition='all .45s cubic-bezier(.22,.61,.36,1)';b.style.opacity=1;b.style.transform='none';},200);
});
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-hero-copy]');
  if(c){
    const mode=c.dataset.heroCopy;
    const pf=heroCache[mode]||dailyPF(mode); // 与卡片一致
    const text=mode==='story'?pfSentence(pf):pfOutText(pf,mode);
    copyText(text,MODE_NAME[mode]+'配方已复制');
    return;
  }
  const w=e.target.closest('[data-hero-wb]'); // 每张卡直达工作台，默认模块=该卡模式
  if(w){
    const mode=w.dataset.heroWb;
    const pf=heroCache[mode]||dailyPF(mode);
    wbSendModal(pf,PF_TO_WB[mode],mode); // 锁定：只能创建该模式对应类型
  }
});
function renderStats(){
  $('#stDom').textContent=STATS.domains;
  $('#stTag').textContent=STATS.tags;
  $('#stL1').textContent=STATS.l1;
  $('#stMod').textContent=STATS.mod;
}
SMCloud.ready.then(()=>{renderHero();renderStats();});
SMCloud.onData(renderStats);
</script>
</body>
</html>
