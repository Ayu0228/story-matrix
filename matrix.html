<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵感方向 · 灵感工作台</title>
<link rel="stylesheet" href="assets/style.css?v=19">
<style>
/* 灵感工作台·方向页专属 */
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:26px;flex-wrap:wrap;min-height:22px}
.crumb{padding:6px 15px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--dim);cursor:pointer;transition:all .25s}
.crumb:hover{color:var(--txt);border-color:var(--line2)}
.crumb.on{background:var(--grad);color:#160b2e;font-weight:800;border-color:transparent}
.crumb-sep{color:var(--dimmer)}
.dom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.dom-card{padding:22px 20px 18px}
.dom-card h3{font-size:19px;font-weight:900}
.dom-card .cnt{font-size:11px;color:var(--dimmer);margin-top:7px;letter-spacing:.08em}
.dom-card .samp{font-size:12.5px;color:var(--dim);margin-top:13px;line-height:1.6;opacity:0;transform:translateY(6px);transition:all .35s var(--ease)}
.dom-card:hover .samp{opacity:1;transform:none}
.l1-rail{display:flex;gap:11px;flex-wrap:wrap}
.l1-card{padding:15px 20px;font-size:15px;font-weight:700}
.l1-card .n{position:static;font-size:10.5px;color:var(--dimmer);letter-spacing:.14em;display:block;margin-bottom:5px;font-weight:600}
.sit-panel{margin-top:26px}
.grp-name{font-size:12px;letter-spacing:.2em;color:var(--dimmer);font-weight:700;margin:22px 0 11px;display:flex;align-items:center;gap:10px}
.grp-name::after{content:'';flex:1;height:1px;background:var(--line)}
.chip-cloud{display:flex;flex-wrap:wrap;gap:9px}
.klib{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:24px}
.klib .col{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.klib .col h4{font-size:12px;letter-spacing:.2em;color:var(--vio);margin-bottom:13px;display:flex;justify-content:space-between;align-items:center}
.klib .col h4 span{color:var(--dimmer);font-weight:500;letter-spacing:.05em}
.klib .chip{font-size:12.5px;padding:6px 12px;margin:0 6px 7px 0}
.empty-hint{color:var(--dimmer);font-size:14px;padding:40px 0;text-align:center}
/* 搜索 */
.sr-mask{position:fixed;inset:0;z-index:80;background:rgba(5,3,12,.7);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}
.sr-mask.open{opacity:1;pointer-events:auto}
.sr-panel{position:fixed;left:50%;top:14vh;transform:translate(-50%,14px);z-index:81;width:min(640px,calc(100vw - 32px));
  background:rgba(15,10,29,.96);border:1px solid var(--line2);border-radius:20px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 50px -8px rgba(167,139,250,.3);opacity:0;pointer-events:none;transition:all .35s var(--spring)}
.sr-mask.open+.sr-panel,.sr-panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.sr-input{width:100%;padding:19px 22px;background:transparent;border:none;outline:none;color:var(--txt);font-size:16.5px;border-bottom:1px solid var(--line)}
.sr-input::placeholder{color:var(--dimmer)}
.sr-list{max-height:52vh;overflow-y:auto;padding:9px}
.sr-row{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;cursor:pointer;transition:background .2s}
.sr-row:hover,.sr-row.sel{background:rgba(167,139,250,.1)}
.sr-row .src{font-size:11px;color:var(--dimmer);flex:none;letter-spacing:.04em}
.sr-row b{font-weight:600;font-size:14.5px}
.sr-row .add{margin-left:auto;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--vio);background:rgba(167,139,250,.13);font-size:15px;flex:none;transition:all .2s}
.sr-row .add:hover{background:var(--grad);color:#160b2e}
.sr-foot{padding:11px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dimmer);display:flex;gap:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker rise">STORY DIRECTIONS</div>
  <h1 class="title rise"><span class="grad-t" data-chars>灵感方向</span></h1>

  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap">
    <div class="mode-tabs" id="domTabs">
      <button class="mode-tab on" data-dmode="story">故事模式</button>
      <button class="mode-tab" data-dmode="music">音乐模式</button>
      <button class="mode-tab" data-dmode="video">短视频模式</button>
    </div>
    <button class="btn btn-ghost btn-sm rip" id="openSr">搜一搜 <kbd>/</kbd></button>
  </div>
  <p class="rise" style="font-size:12.5px;color:var(--dimmer);margin-top:10px" id="domTabTip"></p>

  <div class="crumbs" id="crumbs" style="margin-top:8px"></div>
  <div id="stage"></div>
</div>

<!-- 搜索 -->
<div class="sr-mask" id="srMask"></div>
<div class="sr-panel" id="srPanel">
  <input class="sr-input" id="srInput" placeholder="想找什么？试试「暗恋」「重逢」「被抢功劳」…" autocomplete="off">
  <div class="sr-list" id="srList"></div>
  <div class="sr-foot"><span>↑↓ 移动</span><span>↵ 跳过去</span><span>+ 直接入配方</span><span>esc 关闭</span></div>
</div>

<script src="assets/data.js?v=19"></script>
<script src="assets/common.js?v=19"></script>
<script src="assets/cloud.js?v=19"></script>
<script>
initPage('matrix.html');
const stage=$('#stage'),crumbs=$('#crumbs');
const sel={dom:null,l1:null};

/* ---------- 面包屑 ---------- */
function renderCrumbs(){
  const d=sel.dom?DOMAINS.find(x=>x.id===sel.dom):null;
  let h=`<span class="crumb ${!d?'on':''}" data-go="">全部</span>`;
  if(d){
    h+=`<span class="crumb-sep">→</span><span class="crumb ${!sel.l1?'on':''}" data-go="${d.id}">${d.name}</span>`;
    if(sel.l1!=null)h+=`<span class="crumb-sep">→</span><span class="crumb on">${d.tree[sel.l1].l1}</span>`;
  }
  crumbs.innerHTML=h;
}
crumbs.addEventListener('click',e=>{
  const c=e.target.closest('.crumb');if(!c)return;
  const go=c.dataset.go;
  if(go===''){sel.dom=null;sel.l1=null;renderDomGrid();}
  else{sel.dom=go;sel.l1=null;renderL1();}
});

/* ---------- 第一层：灵感方向（按创作模式分区，标识通用/专属） ---------- */
const DM_KEY='sm_dommode';
const getDMode=()=>{const m=localStorage.getItem(DM_KEY);return MODES.includes(m)?m:'story';};
const setDMode=m=>{if(MODES.includes(m))localStorage.setItem(DM_KEY,m);};
const domInMode=(d,m)=>(d.modes||['story','music','video']).includes(m);
const MODE_BADGE={story:'故事',music:'音乐',video:'短视频'};
function domBadges(d){
  const ms=d.modes||['story','music','video'];
  if(ms.length>=3)return `<span class="dm-badge all">通用</span>`;
  return ms.map(m=>`<span class="dm-badge ${m}">${MODE_BADGE[m]||m}</span>`).join('');
}
const domCard=(d,i)=>{
  const n=flatSits(d).length;
  const samp=d.tree.length?(d.tree[0].tags?d.tree[0].tags.slice(0,2).join(' · '):(d.tree[0].groups?d.tree[0].groups[0].tags.slice(0,2).join(' · '):'')):'还没有内容';
  return `<div class="card dom-card rip" data-dom="${d.id}">
    <span class="idx">${String(i+1).padStart(2,'0')}</span>
    <h3>${esc(d.name)}<span class="dm-badges">${domBadges(d)}</span></h3>
    <div class="cnt">${d.tree.length} 类 · ${n} 个情境</div>
    <div class="samp">${esc(samp)}…</div>
    <span class="crud">
      <button data-ed-dom="${d.id}" title="重命名方向">✎</button>
      <button data-dd-dom="${d.id}" class="del" title="删除方向">✕</button>
    </span>
  </div>`;
};
function renderDomGrid(){
  renderCrumbs();
  const m=getDMode();
  const list=DOMAINS.filter(d=>domInMode(d,m));
  $('#domTabTip').textContent=m==='story'
    ?'故事模式可用全部方向：带「通用」徽章的三模式皆宜，其余为故事或短视频向'
    :(m==='music'?'音乐模式适用方向：通用情感议题最适合写成歌，进灵感组合别忘了选视角与金句方向'
    :'短视频模式适用方向：通用 + 短剧高频题材，进灵感组合别忘了选钩子');
  stage.innerHTML=`<div class="rise"><div class="dom-grid">${list.map((d,i)=>domCard(d,i)).join('')}
      <div class="card dom-card add-card rip" data-adddom="1"><h3 style="font-size:17px">＋ 新建方向</h3><div class="cnt">创建你自己的灵感方向</div></div>
    </div></div>`;
  stagger();
}
$('#domTabs').addEventListener('click',e=>{
  const t=e.target.closest('.mode-tab');if(!t)return;
  setDMode(t.dataset.dmode);
  $$('#domTabs .mode-tab').forEach(x=>x.classList.toggle('on',x===t));
  renderDomGrid();
});
/* 初始化 tab 高亮 */
$$('#domTabs .mode-tab').forEach(x=>x.classList.toggle('on',x.dataset.dmode===getDMode()));
stage.addEventListener('click',e=>{
  if(e.target.closest('.crud')||e.target.closest('.grp-add')||e.target.closest('.add-card'))return; // 编辑按钮走 document 层
  const c=e.target.closest('.dom-card');
  if(c){sel.dom=c.dataset.dom;sel.l1=null;renderL1();}
  const l=e.target.closest('.l1-card');
  if(l&&l.dataset.l1!==undefined){sel.l1=+l.dataset.l1;renderL2();}
});

/* ---------- 第二层：大类 ---------- */
function renderL1(){
  renderCrumbs();
  const d=DOMAINS.find(x=>x.id===sel.dom);
  const total=flatSits(d).length;
  stage.innerHTML=`
    <p class="rise in" style="color:var(--dimmer);font-size:12.5px;letter-spacing:.1em;margin-bottom:16px">${d.name} · ${d.tree.length} 类 · ${total} 个情境</p>
    <div class="l1-rail">${d.tree.map((n,i)=>{
      const cnt=n.tags?n.tags.length:n.groups.reduce((s,g)=>s+g.tags.length,0);
      return `<div class="card l1-card rise rip" data-l1="${i}"><span class="n">${String(i+1).padStart(2,'0')} · ${cnt} 个</span>${esc(n.l1)}
        <span class="crud">
          <button data-ec="${i}" title="重命名分类">✎</button>
          <button data-dc="${i}" class="del" title="删除分类">✕</button>
        </span></div>`;
    }).join('')}
      <div class="card l1-card add-card rip" data-addcat="1" style="display:grid;place-items:center;min-width:110px"><span style="font-size:14px;font-weight:700">＋ 新建分类</span></div>
    </div>
    <div id="l2box"></div>`;
  stagger();
}

/* ---------- 第三层：情境标签 ---------- */
function renderL2(){
  renderCrumbs();
  const d=DOMAINS.find(x=>x.id===sel.dom),n=d.tree[sel.l1];
  if(!n){sel.l1=null;renderL1();return;}
  const sitCrud=t=>`<span class="crud">
      <button data-es="${encodeURIComponent(t)}" title="重命名情境">✎</button>
      <button data-sd="${encodeURIComponent(t)}" class="del" title="删除情境">✕</button>
    </span>`;
  const chip=(t,grp)=>`<span class="chip rip" data-add="sit" data-tag="${esc(t)}" data-dom="${esc(d.name)}"${grp?` data-grp="${esc(grp)}"`:''}>
    <span class="plus">+</span>${esc(t)}${grp?` <span class="src">${esc(grp)}</span>`:''}${sitCrud(t)}</span>`;
  const grpAdd=grp=>`<button class="grp-add" data-gs="${esc(grp||'')}">＋ 加情境</button>`;
  let inner='';
  if(n.tags)inner=`<div class="chip-cloud">${n.tags.map(t=>chip(t)).join('')||'<span class="empty-hint">还没有情境，点上方「＋ 加情境」</span>'}</div>`;
  else inner=n.groups.map(g=>`<div class="grp-name">${esc(g.name)}${grpAdd(g.name)}</div><div class="chip-cloud">${g.tags.map(t=>chip(t,g.name)).join('')}</div>`).join('');
  const itemChip=cat=>t=>{
    const custom=cat==='rel'?!isBuiltinRel(n.l1,t):!isBuiltinScene(n.l1,t);
    return `<span class="chip ${custom?'mine':''} rip" data-add="${cat}" data-tag="${esc(t)}" data-dom="${esc(d.name)}">
      <span class="plus">+</span>${esc(t)}${custom?'<span class="mine-tag">自定义</span>':''}
      <span class="crud">
        <button data-ei="${cat}" data-t="${encodeURIComponent(t)}" title="重命名">✎</button>
        <button data-di="${cat}" data-t="${encodeURIComponent(t)}" class="del" title="删除">✕</button>
      </span></span>`;
  };
  const side=(title,color,cat)=>{
    const arr=cat==='rel'?(RELS[n.l1]||[]):(SCENES[n.l1]||[]);
    return `<div class="grp-name" style="margin-top:18px;color:${color}">${title}<button class="grp-add" data-ga="${cat}">＋ 新增</button></div>
      <div class="chip-cloud">${arr.map(itemChip(cat)).join('')||'<span class="empty-hint" style="padding:10px 0;font-size:12.5px">还没有，点「＋ 新增」添加</span>'}</div>`;
  };
  $('#l2box').innerHTML=`<div class="sit-panel rise in" style="animation:riseIn .5s var(--ease) both">
    <div class="grp-name" style="margin-top:6px">「${esc(n.l1)}」 · 点 + 收进配方${grpAdd('')}</div>${inner}
    ${side('适合的人物关系','#7dd3fc','rel')}${side('适合的故事场景','#6ee7b7','scene')}</div>`;
}

/* ---------- 点击 + 入配方 ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('.crud')||e.target.closest('.grp-add')||e.target.closest('.add-card'))return; // 编辑按钮走 CRUD 处理器
  const a=e.target.closest('[data-add]');
  if(!a)return;
  quickAdd({cat:a.dataset.add,tag:a.dataset.tag,dom:a.dataset.dom});
  a.classList.add('have');
  renderDockStates();
});

/* ---------- 全体系增删改（数据存你的私有仓库） ---------- */
const guard=async()=>{if(await SMCloud.ensureConnected())return true;toast('请先连接存储（右上角「存储」按钮）');return false;};
const curDom=()=>DOMAINS.find(x=>x.id===sel.dom);
const curCat=()=>{const d=curDom();return d&&sel.l1!=null?d.tree[sel.l1]:null;};
const nameModal=(title,label,val,ph,onSave)=>SMCloud.openModal({
  title,okText:'保存',
  body:`<label class="sm-field"><span>${label}</span><input id="smIn" value="${esc(val||'')}" placeholder="${esc(ph||'')}" autocomplete="off"></label>`,
  onOk:m=>{const v=m.querySelector('#smIn').value.trim();if(!v)return false;onSave(v);}
});
document.addEventListener('click',async e=>{
  const q=s=>e.target.closest(s);let m;
  /* ===== 方向 ===== */
  if(m=q('[data-adddom]')){
    if(!(await guard()))return;
    SMCloud.openModal({
      title:'新建方向',okText:'创建',
      body:`<label class="sm-field"><span>方向名称</span><input id="smIn" placeholder="例如：科幻、电竞、宠物…" autocomplete="off"></label>
        <div class="sm-field"><span>适用模式（不选则三模式通用）</span>
          <div class="wb-chips" id="dmModeChips" style="margin-top:8px">${MODES.map(mm=>`<span class="chip rip on" data-mmode="${mm}">${MODE_BADGE[mm]}</span>`).join('')}</div>
        </div>`,
      onReady:m2=>{
        m2.querySelector('#dmModeChips').addEventListener('click',e2=>{
          const c=e2.target.closest('[data-mmode]');if(!c)return;
          c.classList.toggle('on');
        });
      },
      onOk:m2=>{
        const v=m2.querySelector('#smIn').value.trim();
        if(!v)return false;
        const modes=[...m2.querySelectorAll('[data-mmode].on')].map(x=>x.dataset.mmode);
        SMCloud.addDom(v,modes);
        toast('方向已创建，点进去添加分类吧');
      }});
    return;
  }
  else if(m=q('[data-ed-dom]')){
    if(!(await guard()))return;
    const d=DOMAINS.find(x=>x.id===m.dataset.edDom);if(!d)return;
    nameModal('重命名方向','方向名称',d.name,'',v=>{SMCloud.renameDom(d.id,v);toast('已改名');});
  }
  else if(m=q('[data-dd-dom]')){
    if(!(await guard()))return;
    const d=DOMAINS.find(x=>x.id===m.dataset.ddDom);if(!d)return;
    const nSit=flatSits(d).length;
    SMCloud.openModal({title:'删除方向',okText:'确认删除',
      body:`<p class="sm-tip">将永久删除方向「<b>${esc(d.name)}</b>」下的 <b>${d.tree.length}</b> 个分类、<b>${nSit}</b> 个情境，以及该方向所有的人物关系、场景。此操作不可恢复。</p>`,
      onOk:()=>{const r=SMCloud.delDom(d.id);toast(`已删除（连带 ${r.cats} 个分类、${r.sits} 个情境）`);if(sel.dom===d.id){sel.dom=null;sel.l1=null;}}});
  }
  /* ===== 分类 ===== */
  else if(m=q('[data-addcat]')){
    if(!(await guard()))return;
    nameModal('新建分类','分类名称','','例如：误会、重逢、和解…',v=>{SMCloud.addCat(sel.dom,v);toast('分类已创建，点它添加情境');});
  }
  else if(m=q('[data-ec]')){
    if(!(await guard()))return;
    const n=curDom().tree[+m.dataset.ec];
    nameModal('重命名分类','分类名称',n.l1,'',v=>{SMCloud.renameCat(sel.dom,n.l1,v);toast('已改名，关系/场景归属已同步');});
  }
  else if(m=q('[data-dc]')){
    if(!(await guard()))return;
    const i=+m.dataset.dc,n=curDom().tree[i];
    SMCloud.openModal({title:'删除分类',okText:'确认删除',
      body:`<p class="sm-tip">将永久删除分类「<b>${esc(n.l1)}</b>」及其 <b>${(n.tags?n.tags.length:0)+(n.groups?n.groups.reduce((s,g)=>s+g.tags.length,0):0)}</b> 个情境，该分类下的人物关系、场景一并删除。此操作不可恢复。</p>`,
      onOk:()=>{SMCloud.delCat(sel.dom,n.l1);toast('已删除');if(sel.l1===i)sel.l1=null;}});
  }
  /* ===== 情境 ===== */
  else if(m=q('[data-gs]')){
    if(!(await guard()))return;
    const n=curCat(),grp=m.dataset.gs;
    nameModal(grp?`加情境到「${grp}」`:'加情境','情境名称','','例如：深夜加班只剩我们两人…',v=>{SMCloud.addSit(sel.dom,n.l1,v,grp||undefined);toast('已添加');});
  }
  else if(m=q('[data-es]')){
    if(!(await guard()))return;
    const n=curCat(),oldT=decodeURIComponent(m.dataset.es);
    nameModal('重命名情境','情境名称',oldT,'',v=>{SMCloud.renameSit(sel.dom,n.l1,oldT,v);toast('已改名');});
  }
  else if(m=q('[data-sd]')){
    if(!(await guard()))return;
    const n=curCat(),t=decodeURIComponent(m.dataset.sd);
    SMCloud.openModal({title:'删除情境',okText:'确认删除',
      body:`<p class="sm-tip">将永久删除情境「<b>${esc(t)}</b>」。此操作不可恢复。</p>`,
      onOk:()=>{SMCloud.delSit(sel.dom,n.l1,t);toast('已删除');}});
  }
  /* ===== 人物关系 / 场景 ===== */
  else if(m=q('[data-ga]')){
    if(!(await guard()))return;
    const n=curCat(),cat=m.dataset.ga;
    nameModal(cat==='rel'?'新增人物关系':'新增故事场景',cat==='rel'?'关系描述':'场景描述','',
      cat==='rel'?'例如：互相看不顺眼却必须合作':'例如：凌晨的便利店…',
      v=>{cat==='rel'?SMCloud.addRel(v,n.l1):SMCloud.addScene(v,n.l1);toast('已添加');});
  }
  else if(m=q('[data-ei]')){
    if(!(await guard()))return;
    const n=curCat(),cat=m.dataset.ei,oldT=decodeURIComponent(m.dataset.t);
    nameModal(cat==='rel'?'重命名人物关系':'重命名故事场景',cat==='rel'?'关系描述':'场景描述',oldT,'',
      v=>{cat==='rel'?SMCloud.renameRel(n.l1,oldT,v):SMCloud.renameScene(n.l1,oldT,v);toast('已改名');});
  }
  else if(m=q('[data-di]')){
    if(!(await guard()))return;
    const n=curCat(),cat=m.dataset.di,t=decodeURIComponent(m.dataset.t);
    SMCloud.openModal({title:cat==='rel'?'删除人物关系':'删除故事场景',okText:'确认删除',
      body:`<p class="sm-tip">将永久删除「<b>${esc(t)}</b>」。此操作不可恢复。</p>`,
      onOk:()=>{cat==='rel'?SMCloud.delRel(t,n.l1):SMCloud.delScene(t,n.l1);toast('已删除');}});
  }
});
/* 云端数据变化 → 按当前浏览位置全量重渲染 */
SMCloud.onData(()=>{
  if(sel.dom&&!DOMAINS.some(d=>d.id===sel.dom)){sel.dom=null;sel.l1=null;renderDomGrid();}
  else if(sel.l1!=null){
    const d=curDom();
    if(!d||sel.l1>=d.tree.length){sel.l1=null;renderL1();}
    else{renderL1();renderL2();}
  }
  else if(sel.dom)renderL1();
  else renderDomGrid();
  renderDockStates();
});
function renderDockStates(){
  const pf=loadPF();
  $$('[data-add]').forEach(el=>{
    const cat=el.dataset.add==='sit2'?'sit':el.dataset.add;
    el.classList.toggle('have',pf.some(x=>x.cat===cat&&x.tag===el.dataset.tag&&x.dom===el.dataset.dom));
  });
}

/* ---------- 搜索（含自定义条目） ---------- */
const INDEX=[];
function buildIndex(){
  INDEX.length=0;
  DOMAINS.forEach(d=>{
    d.tree.forEach((n,i)=>{
      if(n.tags)n.tags.forEach(t=>INDEX.push({t,dom:d.name,domId:d.id,l1:i,cat:'sit'}));
      if(n.groups)n.groups.forEach(g=>g.tags.forEach(t=>INDEX.push({t,dom:d.name,domId:d.id,l1:i,cat:'sit',grp:g.name})));
    });
  });
  MODIFIERS.forEach(t=>INDEX.push({t,dom:'转折词',cat:'mod'}));
  DOMAINS.forEach(d=>d.tree.forEach((n,i)=>{(RELS[n.l1]||[]).forEach(t=>INDEX.push({t,dom:d.name,domId:d.id,l1:i,grp:n.l1,cat:'rel'}));}));
  DOMAINS.forEach(d=>d.tree.forEach((n,i)=>{(SCENES[n.l1]||[]).forEach(t=>INDEX.push({t,dom:d.name,domId:d.id,l1:i,grp:n.l1,cat:'scene'}));}));
}
buildIndex();
SMCloud.ready.then(buildIndex);
SMCloud.onData(buildIndex);

const srMask=$('#srMask'),srPanel=$('#srPanel'),srInput=$('#srInput'),srList=$('#srList');
let srSel=0,srRows=[];
function openSr(){srMask.classList.add('open');srPanel.classList.add('open');srInput.value='';paintSr('');setTimeout(()=>srInput.focus(),80);}
function closeSr(){srMask.classList.remove('open');srPanel.classList.remove('open');}
$('#openSr').addEventListener('click',openSr);
srMask.addEventListener('click',closeSr);
addEventListener('keydown',e=>{
  if(e.key==='/'&&!srPanel.classList.contains('open')&&document.activeElement.tagName!=='INPUT'){e.preventDefault();openSr();}
  if(e.key==='Escape')closeSr();
  if(!srPanel.classList.contains('open'))return;
  if(e.key==='ArrowDown'){e.preventDefault();srSel=Math.min(srSel+1,srRows.length-1);paintSel();}
  if(e.key==='ArrowUp'){e.preventDefault();srSel=Math.max(srSel-1,0);paintSel();}
  if(e.key==='Enter'&&srRows[srSel]){e.preventDefault();jumpTo(srRows[srSel]);}
});
function paintSel(){$$('.sr-row').forEach((r,i)=>r.classList.toggle('sel',i===srSel));const s=$('.sr-row.sel');if(s)s.scrollIntoView({block:'nearest'});}
function paintSr(q){
  q=q.trim();
  const hits=q?INDEX.filter(x=>(x.t+x.dom+(x.grp||'')).includes(q)):INDEX.slice(0,30);
  srRows=hits.slice(0,50);srSel=0;
  srList.innerHTML=srRows.length?srRows.map((x,i)=>`
    <div class="sr-row ${i===0?'sel':''}" data-i="${i}">
      <span class="src">${x.dom}${x.grp?'·'+x.grp:''} · ${CAT_NAME[x.cat==='sit2'?'sit':x.cat]||CAT_NAME[x.cat]}</span>
      <b>${x.t}</b><span class="add" data-jump="${i}">＋</span>
    </div>`).join(''):`<div class="empty-hint">没有匹配的标签</div>`;
}
srInput.addEventListener('input',()=>paintSr(srInput.value));
function jumpTo(x){
  if(x.cat==='mod'){closeSr();location.href='studio.html';return;}
  sel.dom=x.domId;renderCrumbs();
  if(x.cat==='rel'&&x.l1==null){renderL1();renderDockStates();closeSr();toast(`已定位：${x.dom} 的人物关系`);return;}
  const l1=x.l1!=null?x.l1:0;
  sel.l1=l1;renderL1();renderL2();renderDockStates();closeSr();
  toast(`已定位：${x.dom} · ${DOMAINS.find(d=>d.id===x.domId).tree[l1].l1}`);
}
srList.addEventListener('click',e=>{
  const add=e.target.closest('[data-jump]');
  if(add){const x=srRows[+add.dataset.jump];
    if(x.cat==='mod')quickAdd({cat:'mod',tag:x.t,dom:''});
    else quickAdd({cat:x.cat==='scene'?'scene':x.cat,tag:x.t,dom:x.dom});
    add.textContent='✓';return;}
  const row=e.target.closest('.sr-row');
  if(row)jumpTo(srRows[+row.dataset.i]);
});

/* ---------- 深链 ---------- */
const h=location.hash.slice(1);
if(h&&DOMAINS.some(d=>d.id===h)){sel.dom=h;renderL1();}
else renderDomGrid();
</script>
</body>
</html>
