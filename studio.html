<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵感组合 · 灵感工作台</title>
  <meta name="description" content="26个灵感方向（共情故事+热门类型）、490+个情境、690+组人物关系、490+个故事场景自由搭配，自定义关系与场景，数据存在你自己的 GitHub 私有仓库。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237c3aed'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white'>叙</text></svg>">
  <link rel="stylesheet" href="assets/style.css?v=32">
</head>
<body>
<div class="wrap">

  <div class="kicker rise">MIX &amp; MATCH</div>
  <h1 class="title grad-t" data-chars>灵感组合</h1>

  <div class="mode-tabs rise" id="modeTabs"></div>

  <div style="display:flex;gap:10px;margin:20px 0 22px;flex-wrap:wrap" class="rise">
    <button class="btn btn-pri btn-sm rip" id="btnRandom">🎲 随机配一组</button>
    <button class="btn btn-pri btn-sm rip" id="btnToWB">去工作台创作 ▶</button>
    <button class="btn btn-ghost btn-sm rip" id="btnSave">保存</button>
    <button class="btn btn-ghost btn-sm rip" id="btnCopyTop">复制</button>
    <button class="btn btn-ghost btn-sm rip" id="btnClearTop">清空</button>
  </div>

  <div class="cols" id="cols"></div>

  <section class="saved">
    <div class="sec-head">
      <h2 class="title rise" style="font-size:22px">已存配方</h2>
    </div>
    <div id="savedList"></div>
  </section>
</div>

<script src="assets/data.js?v=32"></script>
<script src="assets/common.js?v=32"></script>
<script src="assets/cloud.js?v=32"></script>
<script>
initPage('studio.html');

/* 同一批底层数据，三种模式叫法不同（转换器命名）：列名/按钮随模式切换 */
const MODE_TITLE={
 music:{sit:['情境','歌词意象库'],rel:['人物关系','歌里的人物'],scene:['故事场景','歌词场景意象'],mod:['情绪落点','转折词在音乐里=情绪落点'],view:['歌词人称','我/你/TA…可多选'],line:['副歌Hook句','金句方向→副歌记忆点'],hook:['歌名钩子','钩子类型→歌名方向']},
 video:{sit:['情境','一镜一个微画面'],rel:['人物关系','短剧人设组合'],scene:['故事场景','拍摄场景库'],mod:['结尾反转','转折词在视频里=结尾反转'],view:['叙事视角','谁在看这个故事'],line:['反转台词','金句方向→反转台词/字幕'],hook:['前三秒钩子','钩子类型→开场抓人']},
 story:{sit:['情境','3~8 字微画面'],rel:['人物关系','谁与谁'],scene:['故事场景','场景卡'],mod:['情节反转','转折词在故事里=情节反转'],view:['叙事视角','视角池'],hook:['开篇钩子','钩子类型→开篇第一句'],endhook:['结尾钩子','章末/集末留钩'],}
};
const CAT_META=[
 {key:'sit', title:'情境', sub:'', dot:'#a78bfa', data:SITS, label:x=>x.tag, src:x=>x.dom+' · '+x.l1, filter:true, modes:MODES},
 {key:'rel', title:'人物关系', sub:'', dot:'#38bdf8', data:REL_LIST, label:x=>x.tag, src:x=>x.dom+' · '+x.l1, filter:true, modes:MODES},
 {key:'scene', title:'故事场景', sub:'', dot:'#34d399', data:SCENE_LIST, label:x=>x.tag, src:x=>x.dom+' · '+x.l1, filter:true, modes:MODES},
 {key:'mod', title:'转折', sub:'', dot:'#f0abfc', data:MODIFIERS.map(t=>({tag:t})), label:x=>x.tag, src:()=>'', filter:false, modes:MODES},
 {key:'view', title:'视角', sub:'', dot:'#c4b5fd', data:VIEW_LIST, label:x=>x.tag, src:()=>'', filter:true, modes:MODES},
 {key:'line', title:'金句方向', sub:'', dot:'#f9a8d4', data:LINE_LIST, label:x=>x.tag, src:()=>'', filter:true, modes:['music','video']},
 {key:'hook', title:'钩子', sub:'', dot:'#fdba74', data:HOOK_LIST, label:x=>x.tag, src:()=>'', filter:true, modes:MODES},
 {key:'endhook', title:'结尾钩子', sub:'', dot:'#fbbf24', data:ENDHOOK_LIST, label:x=>x.tag, src:()=>'', filter:true, modes:['story']},
];
const catOf=k=>(k==='myrel'?'rel':k==='myscene'?'scene':k);
/* 池列展示名（随当前模式）：view/line/hook/endhook */
const poolTitle=k=>{const mt=MODE_TITLE[getMode()]||{};return (mt[k]||[])[0]||CAT_NAME[k]||k;};
/* 同一数据源，但三个模式各自钦定的列顺序不同：故事=反转·视角·开篇钩·结尾钩；音乐=落点·人称·副歌句·歌名钩；短视频=反转·视角·前3秒钩·反转台词 */
const MODE_COL_ORDER={
 story:['sit','rel','scene','mod','view','hook','endhook'],
 music:['sit','rel','scene','mod','view','line','hook'],
 video:['sit','rel','scene','mod','view','hook','line'],
};
const modeCols=()=>{const ord=MODE_COL_ORDER[getMode()]||CAT_META.map(m=>m.key);
 return CAT_META.filter(m=>(m.modes||MODES).includes(getMode()))
  .sort((a,b)=>ord.indexOf(a.key)-ord.indexOf(b.key));};

/* ---------- 配方模式切换 ---------- */
function paintTabs(){
  $('#modeTabs').innerHTML=MODES.map(m=>`
    <button class="mode-tab ${getMode()===m?'on':''}" data-mode="${m}">
      <b>${MODE_NAME[m]}模式</b><small>${MODE_SUB[m]}</small>
    </button>`).join('');
}
paintTabs();
$('#modeTabs').addEventListener('click',e=>{
  const t=e.target.closest('.mode-tab');if(!t)return;
  setMode(t.dataset.mode);
  paintTabs();renderDock();renderCols();
  toast('已切换：'+MODE_NAME[t.dataset.mode]+'模式（列内容与文案输出已切换）');
});

function renderCols(){
  const mt=MODE_TITLE[getMode()]||{};
  $('#cols').innerHTML=modeCols().map(m=>{
   const mtit=mt[m.key]||[m.title,m.sub];
   return `
   <div class="col-panel rise" data-key="${m.key}">
     <div class="col-head"><h3><span class="dot" style="background:${m.dot};box-shadow:0 0 10px ${m.dot}"></span>${mtit[0]}
       <span class="col-count" id="cnt-${m.key}"></span></h3><div class="sub">${mtit[1]||''}</div></div>
     ${m.addKind?`<button class="col-add rip" data-add="${m.addKind}">＋ 添加</button>`:''}
     ${m.key==='mod'?`<button class="col-add rip" data-addmod>＋ 添加${mtit[0]}</button>`:''}
     ${['view','line','hook','endhook'].includes(m.key)?`<button class="col-add rip" data-addpool="${m.key}">＋ 添加${mtit[0]}</button>`:''}
     ${m.filter?`<div class="col-filter">
       <input id="q-${m.key}" placeholder="筛选…">
       ${m.key==='sit'?`<select id="domFilter"><option value="">全部</option>${[...DOMAINS].sort((a,b)=>(((b.fit||{})[getMode()])||2)-(((a.fit||{})[getMode()])||2)).map(d=>{const n=((d.fit||{})[getMode()])||2;return `<option value="${d.name}">${d.name}${'●'.repeat(n)}${'○'.repeat(3-n)}</option>`}).join('')}</select>`:''}
     </div>`:''}
     <div class="col-cloud" id="cloud-${m.key}"></div>
   </div>`;
  }).join('');
  stagger();
  paintAll();
}
/* 筛选输入：全局委托，列重建后无需重新绑定 */
$('#cols').addEventListener('input',e=>{
  if(e.target.id&&e.target.id.startsWith('q-'))paintCol(e.target.id.slice(2));
});
$('#cols').addEventListener('change',e=>{
  if(e.target.id==='domFilter')paintCol('sit');
});

function paintCol(key){
  const m=CAT_META.find(x=>x.key===key);
  const cntEl=$('#cnt-'+key),cloudEl=$('#cloud-'+key);
  if(!m||!cntEl||!cloudEl)return; /* 列未渲染（模式已切但列未重建/云同步回调）时跳过，避免空 DOM 报错中断保存流程 */
  const q=($('#q-'+key)||{value:''}).value.trim();
  const df=($('#domFilter')||{value:''}).value;
  const pf=loadPF();
  const src=m.key==='mod'?MODIFIERS.map(t=>({tag:t})):(m.dataFn?m.dataFn():m.data);
  const real=catOf(key);
  const mode=getMode();
  const wOf=x=>{const d=DOMAINS.find(d=>d.name===x.dom);return (((d&&d.fit)||{})[mode])||2;}; /* 无方向归属的按中档 */
  const filtered=src.filter(x=>(!q||x.tag.includes(q)||(x.dom||'').includes(q)||(x.l1||'').includes(q))&&(!df||!x.dom||x.dom===df));
  /* 按当前模式侧重分档（★★★>★★>★），同档内各方向轮转穿插，避免大方向霸屏 */
  const buckets={};filtered.forEach(x=>{const w=wOf(x);(buckets[w]=buckets[w]||[]).push(x);});
  const list=[];
  Object.keys(buckets).map(Number).sort((a,b)=>b-a).forEach(w=>{
    const byDom={};buckets[w].forEach(x=>{const k=x.dom||'';(byDom[k]=byDom[k]||[]).push(x);});
    const doms=Object.keys(byDom);let i=0,left=buckets[w].length;
    while(left>0){const it=byDom[doms[i++%doms.length]].shift();if(it){list.push(it);left--;}}
  });
  cntEl.textContent='显示 '+list.length+' / '+src.length;
  cloudEl.innerHTML=list.map(x=>{
    const inPf=pf.some(p=>p.cat===real&&p.tag===x.tag&&(real!=='sit'||p.dom===x.dom));
    if(m.addKind)return `<span class="chip mine ${inPf?'have':''}" data-k="${key}" data-t="${esc(x.tag)}" data-d="${x.dom||''}">
      <span class="plus">+</span>${esc(x.tag)} <span class="src">${esc(x.l1)}</span><span class="mine-tag">自定义</span><button class="mine-del" data-del="${encodeURIComponent(x.tag)}‖${encodeURIComponent(x.l1)}" title="删除">×</button></span>`;
    const custom=(key==='mod'&&!isBuiltinMod(x.tag))||(['view','line','hook','endhook'].includes(key)&&!isBuiltinPool(key,x.tag));
    const crud=key==='mod'?`<span class="crud">
        <button data-em="${encodeURIComponent(x.tag)}" title="重命名转折词">✎</button>
        <button data-dm="${encodeURIComponent(x.tag)}" class="del" title="删除转折词">✕</button>
      </span>`:(['view','line','hook','endhook'].includes(key)?`<span class="crud">
        <button data-ep="${key}" data-t="${encodeURIComponent(x.tag)}" title="重命名">✎</button>
        <button data-dp="${key}" data-t="${encodeURIComponent(x.tag)}" class="del" title="删除">✕</button>
      </span>`:'');
    return `<span class="chip ${key==='mod'?'mod':''} ${custom?'mine':''} ${inPf?'have':''}" data-k="${key}" data-t="${esc(x.tag)}" data-d="${x.dom||''}">
      <span class="plus">+</span>${esc(m.label(x))}${custom?'<span class="mine-tag">自定义</span>':''}${m.src(x)?` <span class="src">${esc(m.src(x))}</span>`:''}${crud}</span>`;
  }).join('')||`<div class="empty-hint">${m.addKind||m.key==='mod'?'还没有，点上方「添加」创建':'无匹配'}</div>`;
}
function paintAll(){modeCols().forEach(m=>paintCol(m.key));}
SMCloud.ready.then(renderCols);
SMCloud.onData(()=>{if($('#cols').children.length)paintAll();else renderCols();});

renderCols(); /* 首屏立即渲染（离线可用），云数据到位后 ready 再刷新一次 */
/* 点击：删除自定义 / 添加自定义 / 转折词增删改 / 入配方 */
$('#cols').addEventListener('click',async e=>{
  const del=e.target.closest('.mine-del');
  if(del){
    e.stopPropagation();
    const [tag,l1]=del.dataset.del.split('‖').map(decodeURIComponent);
    const kind=del.closest('[data-key]').dataset.key==='myrel'?'rel':'scene';
    if(kind==='rel'?SMCloud.delRel(tag,l1):SMCloud.delScene(tag,l1)){toast('已删除');paintAll();}
    return;
  }
  /* 转折词：新增 */
  if(e.target.closest('[data-addmod]')){
    if(!(await SMCloud.ensureConnected()))return toast('请先连接存储（右上角「存储」）');
    SMCloud.openModal({
      title:'添加转折词',okText:'添加',
      body:`<label class="sm-field"><span>转折词</span><input id="smIn" maxlength="8" placeholder="例如：坦白、诀别、反杀…" autocomplete="off"></label>`,
      onOk:m=>{const v=m.querySelector('#smIn').value.trim();if(!v)return false;SMCloud.addMod(v);toast('已添加，随机配方会用到它');}
    });
    return;
  }
  /* 模式池：新增 / 重命名 / 删除（视角/金句/钩子/结尾钩子，与灵感方向同一数据源） */
  const ap=e.target.closest('[data-addpool]');
  if(ap){
    const k=ap.dataset.addpool;
    if(!(await SMCloud.ensureConnected()))return toast('请先连接存储（右上角「存储」）');
    SMCloud.openModal({
      title:'添加'+poolTitle(k),okText:'添加',
      body:`<label class="sm-field"><span>名称</span><input id="smIn" maxlength="12" placeholder="例如：记忆闪回、第二人称…" autocomplete="off"></label>`,
      onOk:m=>{const v=m.querySelector('#smIn').value.trim();if(!v)return false;SMCloud.addPool(k,v);toast('已添加');}
    });
    return;
  }
  const ep=e.target.closest('[data-ep]'),dp=e.target.closest('[data-dp]');
  if(ep||dp){
    e.stopPropagation();
    if(!(await SMCloud.ensureConnected()))return toast('请先连接存储（右上角「存储」）');
    if(ep){
      const k=ep.dataset.ep,oldT=decodeURIComponent(ep.dataset.t);
      SMCloud.openModal({
        title:'重命名'+poolTitle(k),okText:'保存',
        body:`<label class="sm-field"><span>名称</span><input id="smIn" value="${esc(oldT)}" maxlength="12" autocomplete="off"></label>`,
        onOk:m=>{const v=m.querySelector('#smIn').value.trim();if(!v||v===oldT)return false;SMCloud.renamePool(k,oldT,v);toast('已改名');}
      });
    }else{
      const k=dp.dataset.dp,t=decodeURIComponent(dp.dataset.t);
      SMCloud.openModal({
        title:'删除'+poolTitle(k),okText:'确认删除',
        body:`<p class="sm-tip">将永久删除「<b>${esc(t)}</b>」。此操作不可恢复。</p>`,
        onOk:()=>{SMCloud.delPool(k,t);toast('已删除');}
      });
    }
    return;
  }
  /* 转折词：重命名 / 删除 */
  const em=e.target.closest('[data-em]'),dm=e.target.closest('[data-dm]');
  if(em||dm){
    e.stopPropagation();
    if(!(await SMCloud.ensureConnected()))return toast('请先连接存储（右上角「存储」）');
    if(em){
      const oldT=decodeURIComponent(em.dataset.em);
      SMCloud.openModal({
        title:'重命名转折词',okText:'保存',
        body:`<label class="sm-field"><span>转折词</span><input id="smIn" value="${esc(oldT)}" maxlength="8" autocomplete="off"></label>`,
        onOk:m=>{const v=m.querySelector('#smIn').value.trim();if(!v||v===oldT)return false;SMCloud.renameMod(oldT,v);toast('已改名');}
      });
    }else{
      const t=decodeURIComponent(dm.dataset.dm);
      SMCloud.openModal({
        title:'删除转折词',okText:'确认删除',
        body:`<p class="sm-tip">将永久删除转折词「<b>${esc(t)}</b>」。此操作不可恢复。</p>`,
        onOk:()=>{SMCloud.delMod(t);toast('已删除');}
      });
    }
    return;
  }
  const add=e.target.closest('[data-add]');
  if(add){await openAddModal(add.dataset.add);return;}
  const c=e.target.closest('.chip[data-k]');if(!c)return;
  quickAdd({cat:catOf(c.dataset.k),tag:c.dataset.t,dom:c.dataset.d});
  paintAll();
});

/* 添加自定义弹窗：名称 + 所属分类（随机配方与下钻按分类归位） */
async function openAddModal(kind){
  if(!(await SMCloud.ensureConnected()))return toast('请先连接存储（右上角「存储」）');
  const isRel=kind==='rel';
  SMCloud.openModal({
    title:isRel?'添加自定义人物关系':'添加自定义故事场景',
    okText:'添加',
    body:`
      <p class="sm-tip">自定义条目带「自定义」标记，和系统内置区分；归到所选分类后，<b>随机配方和下钻页都会用到它</b>。</p>
      <label class="sm-field"><span>名称</span><input id="addName" maxlength="16" placeholder="${isRel?'例如：闺蜜与她的猫':'例如：凌晨的急诊室'}"></label>
      <label class="sm-field"><span>属于哪个分类</span><input id="addL1" list="l1opts" placeholder="输入或选择，如：委屈 / 裂缝 / 暖意">
        <datalist id="l1opts">${Object.keys(L1_DOM).map(k=>`<option value="${k}">`).join('')}</datalist></label>
    `,
    onOk:(mask)=>{
      const tag=mask.querySelector('#addName').value.trim();
      const l1=mask.querySelector('#addL1').value.trim();
      if(!tag)throw new Error('请填写名称');
      if(!L1_DOM[l1])throw new Error('分类不存在，请从下拉列表里选择');
      if((isRel?RELS[l1]:SCENES[l1]||[]).includes(tag))throw new Error('系统内置里已有同名条目');
      if(SMCloud.data[isRel?'rels':'scenes'].some(x=>x.tag===tag&&x.l1===l1))throw new Error('你的自定义里已有同名条目');
      const ok=isRel?SMCloud.addRel(tag,l1):SMCloud.addScene(tag,l1);
      if(ok)toast('已添加，正在同步…');
      return ok;
    }
  });
}

/* 随机 / 保存 / 复制 / 清空 */
function doRandom(){
  pfClear();
  randomPF(getMode()).forEach(x=>pfAdd(x));
  renderDock();paintAll();
  toast('已随机配好一组'+MODE_NAME[getMode()]+'配方，可直接复制');
}
$('#btnRandom').addEventListener('click',doRandom);
$('#btnClearTop').addEventListener('click',()=>{pfClear();renderDock();paintAll();toast('已清空');});
$('#btnCopyTop').addEventListener('click',()=>{
  const a=loadPF();
  if(!a.length)return toast('配方是空的');
  copyText(pfOutText(a),MODE_NAME[getMode()]+'配方已复制');
});
/* 配方 → 工作台：按配方内容识别类型（视角/金句=音乐，钩子=短视频），
   弹窗锁定当前模式：只能创建对应类型项目；跨模式请在工作台用「以此项目新建」衍生 */
$('#btnToWB').addEventListener('click',()=>{
  const pf=loadPF();
  if(!pf.length)return toast('配方篮是空的：先随机配一组，或点列里的 ＋ 添加');
  wbSendModal(pf,null,getMode()); // 锁定：只能创建当前模式对应类型
});
$('#btnSave').addEventListener('click',()=>{  const a=loadPF();
  if(a.length<2)return toast('至少组合 2 个元素再保存');
  const sv=loadSV();
  sv.unshift({t:Date.now(),items:a});
  saveSV(sv.slice(0,30));
  paintSaved();
  toast(SMCloud.isOn()?'已保存并同步':'已保存（未连接存储，只存在本浏览器）');
});

/* 已存配方 */
function paintSaved(){
  const sv=loadSV(),box=$('#savedList');
  if(!sv.length){
    box.innerHTML=`<div class="empty-hint">${SMCloud.isOn()?'暂无':'未连接存储——保存的配方只留在本浏览器；点右上角「存储」连接后跨设备可用'}</div>`;
    return;
  }
  box.innerHTML=sv.map((s,i)=>`
    <div class="saved-row">
      <div class="sf">${pfText(s.items)}</div>
      <div class="st">${new Date(s.t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} · ${s.items.length} 个元素</div>
      <div class="ops">
        <button class="mini rip" data-load="${i}">载入</button>
        <button class="mini del rip" data-del="${i}">删除</button>
      </div>
    </div>`).join('');
}
$('#savedList').addEventListener('click',e=>{
  const l=e.target.closest('[data-load]'),d=e.target.closest('[data-del]');
  if(l){savePF(loadSV()[+l.dataset.load].items);renderDock();paintAll();toast('已载入配方');}
  if(d){const sv=loadSV();sv.splice(+d.dataset.del,1);saveSV(sv);paintSaved();toast('已删除');}
});
SMCloud.ready.then(paintSaved);
SMCloud.onData(()=>{paintSaved();renderDock();});
</script>
</body>
</html>
